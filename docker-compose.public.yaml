services:
  admin-api:
    image: ${ADMIN_IMAGE:-hsgram_admin-admin-api:latest}
    restart: always
    environment:
      ADMIN_DATABASE_DSN: ${ADMIN_DATABASE_DSN}
      ADMIN_ENABLE_BROADCASTS: ${ADMIN_ENABLE_BROADCASTS:-true}
      ADMIN_MSG_RPC_ADDR: ${ADMIN_MSG_RPC_ADDR:-hsgram_server-teamgram-1:20030}
      ADMIN_AUTHSESSION_RPC_ADDR: ${ADMIN_AUTHSESSION_RPC_ADDR:-hsgram_server-teamgram-1:20450}
      ADMIN_SYNC_RPC_ADDR: ${ADMIN_SYNC_RPC_ADDR:-hsgram_server-teamgram-1:20420}
      ADMIN_STATUS_RPC_ADDR: ${ADMIN_STATUS_RPC_ADDR:-hsgram_server-teamgram-1:20670}
      ADMIN_GATEWAY_RPC_ADDR: ${ADMIN_GATEWAY_RPC_ADDR:-hsgram_server-teamgram-1:20110}
      ADMIN_REDIS_ADDR: ${ADMIN_REDIS_ADDR:-redis:6379}
      ADMIN_REDIS_PASS: ${ADMIN_REDIS_PASS:-}
      ADMIN_RELEASES_DIR: ${ADMIN_RELEASES_DIR:-/app/releases}
      ADMIN_PUBLIC_BASE_URL: ${ADMIN_PUBLIC_BASE_URL}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-12h}
      ADMIN_HTTP_READ_TIMEOUT: ${ADMIN_HTTP_READ_TIMEOUT:-30m}
      ADMIN_HTTP_WRITE_TIMEOUT: ${ADMIN_HTTP_WRITE_TIMEOUT:-30m}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
    volumes:
      - ./data/releases:/app/releases
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - admin_net
      - hsgram_server_teamgram_net

  caddy:
    image: caddy:2.8
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      ADMIN_SITE_ADDRESS: ${ADMIN_SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - admin_net

networks:
  admin_net:
    driver: bridge
  hsgram_server_teamgram_net:
    external: true
